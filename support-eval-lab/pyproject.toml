[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-eval-lab"
version = "0.1.0"
description = "Deterministic, human-reviewable support-agent regression starter"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Support Agent Regression Lab contributors" }]
dependencies = []

[project.scripts]
support-eval = "support_eval_lab.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
