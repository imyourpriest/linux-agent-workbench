[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-release-readiness"
version = "0.1.0"
description = "Static trusted-local evidence demos for Linux release-readiness repairs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Cairn-Inspo contributors" }]
dependencies = []

[project.scripts]
release-readiness = "release_readiness.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
