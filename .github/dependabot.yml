version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /patch-cabinet
    schedule:
      interval: weekly
    # Pause version PRs for the pinned evidence engine; security updates remain enabled.
    # Issue 3 tracks the versioned migration needed before ordinary upgrades resume.
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /revenue-lab
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
