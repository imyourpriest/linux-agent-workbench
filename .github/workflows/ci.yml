name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project packages
        run: python -m pip install ./patch-cabinet ./revenue-lab ./support-eval-lab

      - name: Smoke-test installed entry points
        run: |
          patch-cabinet --help
          release-readiness --help
          support-eval --help

      - name: Test Patch Cabinet
        run: python -m unittest discover -s patch-cabinet/tests -v

      - name: Replay registered Patch Cabinet engines
        run: python tools/check_evidence_bundles.py

      - name: Test Release Readiness Lab
        run: python -m unittest discover -s revenue-lab/tests -v

      - name: Test Support Agent Regression Lab
        run: python -m unittest discover -s support-eval-lab/tests -v

      - name: Compile project modules
        run: >-
          python -m compileall -q
          patch-cabinet/src
          revenue-lab/src
          support-eval-lab/src

  revenue-windows:
    # Preserve the protected required-check name while broadening this job to both prototypes.
    name: Release Readiness on Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install and test project packages
        run: |
          python -m pip install ./patch-cabinet ./revenue-lab ./support-eval-lab
          patch-cabinet --help
          release-readiness --help
          support-eval --help
          python -m unittest discover -s patch-cabinet/tests -v
          python -m unittest discover -s revenue-lab/tests -v
          python -m unittest discover -s support-eval-lab/tests -v

  generated-evidence:
    name: Generated evidence is current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install project packages
        run: python -m pip install ./patch-cabinet ./revenue-lab ./support-eval-lab

      - name: Check public tree for private paths and secret signatures
        run: python tools/check_public_tree.py

      - name: Test versioned evidence replay controls
        run: python -m unittest discover -s tools/tests -v

      - name: Verify immutable candidate evidence bundles
        run: python tools/check_evidence_bundles.py

      - name: Regenerate Patch Cabinet sample
        working-directory: patch-cabinet
        run: >-
          patch-cabinet score
          data/candidates/synthetic.json
          --as-of 2026-08-07
          --historical-demo
          --allow-no-local-exclusions
          --markdown-out samples/candidate-ranking.md
          --json-out samples/candidate-ranking.json

      - name: Regenerate Patch Cabinet consent catalog
        working-directory: patch-cabinet
        run: >-
          python -m patch_cabinet.consent_catalog
          data/consent-catalog/v1
          --as-of 2026-08-10
          --markdown-out samples/consent-catalog-index.md
          --json-out samples/consent-catalog-index.json

      - name: Regenerate Patch Cabinet manual policy-profile catalog
        working-directory: patch-cabinet
        run: >-
          python -m patch_cabinet.policy_profile_catalog
          data/policy-profile-catalog/v1
          --consent-records data/consent-catalog/v1
          --markdown-out samples/policy-profile-catalog-index.md
          --json-out samples/policy-profile-catalog-index.json

      - name: Regenerate Release Readiness Lab sample
        working-directory: revenue-lab
        run: >-
          release-readiness audit
          samples/demo-cli
          --repository-url https://example.invalid/release-readiness/demo-cli
          --commit-sha 1111111111111111111111111111111111111111
          --observed-at 2026-08-07
          --unverified-demo
          --markdown-out samples/demo-report.md
          --json-out samples/demo-report.json

      - name: Regenerate Support Agent Regression Lab sample
        working-directory: support-eval-lab
        run: >-
          support-eval compare
          samples/cases.jsonl
          samples/baseline.jsonl
          samples/candidate.jsonl
          --markdown-out samples/comparison.md
          --json-out samples/comparison.json

      - name: Regenerate Support channel observation
        working-directory: support-eval-lab
        run: >-
          python -m support_eval_lab.observation
          experiments/sel-gh-001.json
          observations/sel-gh-001-window.json
          --as-of 2026-08-09T00:50:13Z
          --markdown-out samples/channel-observation.md
          --json-out samples/channel-observation.json

      - name: Verify generated files
        run: git diff --exit-code
